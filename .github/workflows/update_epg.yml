name: 每日更新EPG数据

on:
  schedule:
    # 每天UTC 16:50 运行（对应北京时间 00:50）
    - cron: '50 16 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史才能 amend

      - name: 配置 Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # 先拉取最新代码
      - name: 拉取远程最新变更
        run: git pull origin ${{ github.ref_name }}
      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 先生成文件
      - name: 运行EPG整合脚本
        run: python epg_integrator.py

      # 现在基于最新状态提交或 amend
      - name: 提交更新的 EPG 文件（智能 amend / 新建）
        run: |
          git add epg/e.xml.gz
          # 如果暂存区没变化直接退出
          git diff --staged --quiet && exit 0

          last_msg=$(git log -1 --pretty=%s || true)
          if [[ "$last_msg" =~ ^自动更新:EPG数据 ]]; then
            git commit --amend -m "自动更新:EPG数据 $(date +'%Y-%m-%d')"
          else
            git commit -m "自动更新:EPG数据 $(date +'%Y-%m-%d')"
          fi

      # 最后推送
      - name: 推送更改
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}
          branch: ${{ github.ref }}
          force: true      # amend 后需要 force