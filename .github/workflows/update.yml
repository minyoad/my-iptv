name: 每日更新数据源（播放列表 + EPG）

on:
  schedule:
    # 每天UTC 16:50 运行（对应北京时间 00:50）
    - cron: '50 16 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史才能 amend

      - name: 配置 Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 强制 UTF-8，避免提交信息被写入 GB2312 等编码头导致 GitHub 显示乱码
          git config --local i18n.commitEncoding UTF-8
          git config --local i18n.logOutputEncoding UTF-8
          git config --local core.quotepath false

      - name: 拉取远程最新变更
        run: git pull origin ${{ github.ref_name }}

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------- 1. 整合 EPG ----------
      - name: 运行EPG整合脚本
        run: python epg_integrator.py

      # ---------- 2. 下载 iptvs.mybacc.com 播放列表与EPG ----------
      - name: 下载播放列表与EPG
        run: |
          set -e
          mkdir -p iptvs
          cd iptvs

          total=0
          failed=0

          download() {
            url="$1"
            out="$2"
            total=$((total + 1))
            echo "下载: $out <- $url"
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 300 \
                -H "User-Agent: Mozilla/5.0" \
                -o "$out.tmp" "$url"; then
              mv "$out.tmp" "$out"
              echo "  完成: $(wc -c < "$out") 字节"
            else
              rm -f "$out.tmp"
              failed=$((failed + 1))
              echo "  失败: $out（保留上一次的文件）"
            fi
          }

          download "https://iptvs.mybacc.com/api/export/m3u?isp=%E7%94%B5%E4%BF%A1&status=active&maxPerChannel=20" "tv_电信.m3u"
          download "https://iptvs.mybacc.com/api/export/txt?isp=%E7%94%B5%E4%BF%A1&status=active&maxPerChannel=20"  "tv_电信.txt"
          download "https://iptvs.mybacc.com/api/export/m3u?isp=%E7%A7%BB%E5%8A%A8&status=active&maxPerChannel=20"  "tv_移动.m3u"
          download "https://iptvs.mybacc.com/api/export/txt?isp=%E7%A7%BB%E5%8A%A8&status=active&maxPerChannel=20"  "tv_移动.txt"
          download "https://iptvs.mybacc.com/api/export/m3u?category=%E8%BD%AE%E6%92%AD%E9%A2%91%E9%81%93&status=active&maxPerChannel=10" "轮播.m3u"
          download "https://iptvs.mybacc.com/api/export/txt?category=%E8%BD%AE%E6%92%AD%E9%A2%91%E9%81%93&status=active&maxPerChannel=10" "轮播.txt"

          download "https://iptvs.mybacc.com/api/export/epg.xml.gz" "epg.xml.gz"

          echo "下载结果: 共 $total 个，失败 $failed 个"
          [ "$failed" -lt "$total" ] || { echo "全部下载失败，终止"; exit 1; }

      # ---------- 3. 一次性提交（智能 amend / 新建） ----------
      - name: 提交更新（智能 amend / 新建）
        run: |
          git add epg/e.xml.gz iptvs/
          # 暂存区没变化直接退出
          git diff --staged --quiet && exit 0

          last_msg=$(git log -1 --pretty=%s || true)
          if [[ "$last_msg" =~ ^自动更新:(EPG数据|IPTV源|数据源) ]]; then
            git commit --amend -m "自动更新:数据源 $(date +'%Y-%m-%d')"
          else
            git commit -m "自动更新:数据源 $(date +'%Y-%m-%d')"
          fi

      - name: 推送更改
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}
          branch: ${{ github.ref }}
          force: true      # amend 后需要 force
